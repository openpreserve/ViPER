name: Build ViPER OVA

on:
  push:
    tags:
      - 'v*.*.*'
      - 'release-*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ansible python3-pip wget unzip
          pip3 install jmespath
      
      - name: Install Packer
        run: |
          PACKER_VERSION="1.11.2"
          wget -q https://releases.hashicorp.com/packer/${PACKER_VERSION}/packer_${PACKER_VERSION}_linux_amd64.zip
          unzip packer_${PACKER_VERSION}_linux_amd64.zip
          sudo mv packer /usr/local/bin/
          packer version
      
      - name: Initialize Packer plugins
        run: packer init viper.pkr.hcl
      
      - name: Enable KVM
        run: |
          sudo apt-get install -y cpu-checker
          sudo kvm-ok || echo "KVM not available, will use software emulation"
          # Set KVM permissions for current user without requiring group membership
          if [ -c /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            echo "KVM permissions set"
          else
            echo "KVM device not available"
          fi
      
      - name: Validate Packer template
        run: packer validate viper.pkr.hcl
      
      - name: Build VM with Packer
        run: |
          # Check if KVM is available
          if [ -c /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "KVM is available, using hardware acceleration"
            ACCELERATOR="kvm"
          else
            echo "KVM not available, using software emulation (TCG)"
            ACCELERATOR="tcg"
          fi
          
          # Run packer build (without sudo to avoid Ansible file transfer issues)
          packer build \
            -var 'headless=true' \
            -var "accelerator=${ACCELERATOR}" \
            viper.pkr.hcl
        timeout-minutes: 60
      
      - name: Convert to OVA
        run: ./scripts/convert-to-ova.sh
      
      - name: Create split zip archive
        run: |
          cd output
          echo "Creating split zip archive (1.9GB parts to stay under GitHub's 2GB limit)..."
          zip -s 1900m viper-v1.2-alpha.zip viper-v1.2-alpha.ova
          echo "Split archive created:"
          ls -lh viper-v1.2-alpha.z* viper-v1.2-alpha.zip
      
      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
      - name: Create release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: output/viper-v1.2-alpha.*
          draft: false
          prerelease: false
          body: |
            ViPER VM Build ${{ steps.version.outputs.VERSION }}
            
            ## Installation
            
            **Important:** This release contains a split zip archive due to GitHub's 2GB file size limit.
            
            1. Download **ALL** files from this release:
               - `viper-v1.2-alpha.z01`
               - `viper-v1.2-alpha.z02`
               - `viper-v1.2-alpha.z03`
               - `viper-v1.2-alpha.zip`
            
            2. Extract the OVA file:
               ```bash
               # Linux/macOS with zip utilities
               zip -F viper-v1.2-alpha.zip --out complete.zip
               unzip complete.zip
               
               # Or use 7-Zip (Windows/Linux/macOS)
               7z x viper-v1.2-alpha.zip
               ```
            
            3. Import `viper-v1.2-alpha.ova` into VirtualBox, VMware, or other OVF-compatible virtualization platform
            
            4. Start the VM
            
            ## Default Credentials
            - Username: vagrant
            - Password: vagrant
            
            ## VM Specifications
            - OS: Debian 12 (Bookworm)
            - CPUs: 2
            - Memory: 4GB
            - Disk: 50GB
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: viper-ova-${{ steps.version.outputs.VERSION }}
          path: output/viper-v1.2-alpha.*
          retention-days: 30
