---
# Install FIDO (Format Identification for Digital Objects)
# Python-based command-line tool for file format identification

- name: "FIDO | Install Python3 pip if not present."
  apt:
    name: "python3-pip"
    state: "present"

- name: "FIDO | Install FIDO via pip (with --break-system-packages for Debian 12+)."
  pip:
    name: "{{ viper.tools.fido.package }}"
    version: "{{ viper.tools.fido.version }}"
    state: "present"
    executable: pip3
    extra_args: "--break-system-packages"

- name: "FIDO | Verify FIDO installation."
  command: "fido -v"
  register: fido_version_check
  changed_when: false
  failed_when: fido_version_check.rc != 0

- name: "FIDO | Display installed version."
  debug:
    msg: "{{ fido_version_check.stdout_lines }}"
