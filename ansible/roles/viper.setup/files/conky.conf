-- Conky configuration for ViPER Docker
-- Simple system monitor with CPU, RAM, and Network stats

conky.config = {
    -- Window settings
    alignment = 'top_right',
    gap_x = 20,
    gap_y = 60,
    minimum_width = 250,
    maximum_width = 250,
    
    -- Appearance
    background = true,
    border_width = 1,
    default_color = '8A2BE2',
    default_outline_color = 'white',
    default_shade_color = 'white',
    draw_borders = false,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = false,
    
    -- Transparency
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'normal',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 180,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    
    -- Font
    use_xft = true,
    font = 'DejaVu Sans Mono:size=9',
    
    -- Update interval
    update_interval = 2.0,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    
    -- Double buffer to reduce flicker
    double_buffer = true,
    
    -- Colors (all white)
    default_color = 'FFFFFF',
    color1 = 'FFFFFF',  -- White
    color2 = 'FFFFFF',  -- White
    color3 = 'FFFFFF',  -- White
}

conky.text = [[
${color}${font DejaVu Sans:size=11:bold}ViPER SYSTEM${font}
${hr 2}

${font DejaVu Sans:size=9:bold}CPU${goto 95}RAM${goto 175}NET${font}
${cpubar 60,70}${goto 90}${membar 60,70}${goto 170}${downspeedgraph eth0 60,70 FFFFFF FFFFFF -t}
${font DejaVu Sans:size=8}${cpu}%${goto 100}${memperc}%${goto 180}${downspeed eth0}${font}

${voffset 10}${font DejaVu Sans:size=10:bold}Time & Location${font}
${time %A, %d %B %Y}
${time %H:%M:%S}
Timezone: ${tztime Europe/London %Z}

${font DejaVu Sans:size=10:bold}System Temperature${font}
CPU Temp: ${hwmon 0 temp 1}°C

${font DejaVu Sans:size=10:bold}CPU Usage${font}
CPU: ${cpu cpu0}%
${cpubar cpu0 8,}
${cpugraph cpu0 40,250 FFFFFF FFFFFF}

${font DejaVu Sans:size=10:bold}Memory${font}
RAM: $mem / $memmax
${membar 8,}

${font DejaVu Sans:size=10:bold}Disk I/O${font}
Read:  ${diskio_read}
${diskiograph_read 30,250 FFFFFF FFFFFF}
Write: ${diskio_write}
${diskiograph_write 30,250 FFFFFF FFFFFF}

${font DejaVu Sans:size=10:bold}Network${font}
Up:   ${upspeed eth0}
${upspeedgraph eth0 30,250 FFFFFF FFFFFF}
Down: ${downspeed eth0}
${downspeedgraph eth0 30,250 FFFFFF FFFFFF}
]]
