---
# viper.setup default values
# Default packages for Docker containers (minimal set, for Debian Bookworm)
viper_env_apt_docker_defaults:
  - "git"
  - "apt-transport-https"
  - "psmisc"
  - "net-tools"
  - "python3-psutil"
  - "zip"
  - "unzip"
  - "keyboard-configuration"
  - "console-setup"
  - "openjdk-17-jre"
  - "evince"
  - "locales"

# Default packages for VMs (includes desktop environment)
viper_env_apt_vm_defaults:
  - "git"
  - "apt-transport-https"
  - "psmisc"
  - "net-tools"
  - "python3-psutil"
  - "zip"
  - "unzip"
  - "keyboard-configuration"
  - "console-setup"
  - "openjdk-17-jre"
  - "openjdk-17-doc"
  - "openjdk-17-source"
  - "task-gnome-desktop"
  - "nemo"
  - "locales"

# Use Docker defaults if running in Docker, otherwise use VM defaults
viper_env_apt_defaults: "{{ (ansible_virtualization_type == 'docker') | ternary(viper_env_apt_docker_defaults, viper_env_apt_vm_defaults) }}"

viper_env_apt_remove:
  # - "acpi"
  # - "apcid"
  # - "aptitude"
  # - "at"
  # - "aspell"
