---
# Playbook for Packer builds - simplified without SSH key scanning
# File: ansible/packer.yml

- hosts: default
  become: true
  gather_facts: yes
  vars:
    # viper.setup reads viper_env_*. These were named opf_server_*, which the role
    # never looks at, so the hostname task fell back to its default and every built
    # machine came out called "localhost".
    viper_env_timezone: "Europe/Berlin"
    viper_env_hostname: "viper"
    viper_env_hostdomain: "viper.test"
    viper_env_fqdn: "{{ viper_env_hostname }}.{{ viper_env_hostdomain }}"
  roles:
    - { role: viper.setup }
    - { role: viper.tools }
